server {
  listen 8010;
  listen [::]:8010;
  server_name 109.235.117.161 _;

  # SPA-фронт (собранный Vite)
  root /home/expes/frontend/dist;
  index index.html;

  client_max_body_size 60M;

  # Сжатие
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Кеш статики
  location /assets/ {
      expires 30d;
      access_log off;
      add_header Cache-Control "public, immutable";
  }

  # API → uvicorn на 127.0.0.1:8011
  # Трейлинг-слеш в proxy_pass срезает префикс /api/ :
  #   /api/auth/login  ->  http://127.0.0.1:8011/auth/login
  location /api/ {
      proxy_pass http://127.0.0.1:8011/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
  }

  # SPA-fallback (vue-router history mode)
  location / {
      try_files $uri $uri/ /index.html;
  }
}
